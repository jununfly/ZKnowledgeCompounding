[package]
name = "metrics-snapshot"
version = "0.1.0"
edition = "2024"
publish = false
description = "Front door for `metrics-snapshot`, generated by rust-anything: Rust owns the entry point, the original answers what is not ported yet"

[[bin]]
name = "metrics-snapshot"
path = "src/main.rs"

[dependencies]
clap = "4"
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-none"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zkc-transport-rs = { path = "../transport-rs" }
zkc-context-pure-rs = { path = "../context-pure-rs" }
zkc-expiry-pure-rs = { path = "../expiry-pure-rs" }
zkc-scheduling-interval-rs = { path = "../scheduling-interval-rs" }
zkc-faithfulness-rubric-rs = { path = "../faithfulness-rubric-rs" }
zkc-routing-tfidf-rs = { path = "../routing-tfidf-rs" }
cross-source-rs = { path = "../cross-source-rs" }
distill-parse-rs = { path = "../distill-parse-rs" }
r14-judgment-rs = { path = "../r14-judgment-rs" }
artifact-shaping-rs = { path = "../artifact-shaping-rs" }
injection-detection-rs = { path = "../injection-detection-rs" }
percentile-rs = { path = "../percentile-rs" }
operator-guard-rs = { path = "../operator-guard-rs" }
telemetry-validation-rs = { path = "../telemetry-validation-rs" }
schedule-render-rs = { path = "../schedule-render-rs" }
review-gate-rs = { path = "../review-gate-rs" }
capture-profile-rs = { path = "../capture-profile-rs" }
mcp-exposure-rs = { path = "../mcp-exposure-rs" }

[workspace]
