[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zkc"
version = "0.1.0"
description = "ZKC 个人知识复利工具：让有限的时间精力与注意力对知识产生复利"
requires-python = ">=3.9"

# 依赖统一由 requirements.txt 管理（R19「依赖最少」不变量的 SoT），
# pyproject 只负责打包与 src 布局，不重复声明依赖。

[tool.setuptools.packages.find]
where = ["src"]

# 对外契约快照是非 .py 资源，必须显式声明才会进 wheel；
# editable 安装（make setup）读源码目录，非 editable 安装靠这段。
[tool.setuptools.package-data]
zkc = ["transport/contract_v1.json"]

[project.scripts]
zkc = "zkc.cli:main"
